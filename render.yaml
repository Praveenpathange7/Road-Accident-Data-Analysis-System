services:
  - type: web
    name: roadwise-road-accident-analysis
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --access-logfile - app:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_SOURCE
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: road_accident_db
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false
