<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Explore trusted road accident data and safety insights for India."><meta name="theme-color" content="#f4f2f0"><script>try{document.documentElement.dataset.theme=localStorage.getItem('roadwise-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script><title>{% block title %}Roadwise · Road safety data{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<a class="skip-link" href="#main-content">Skip to main content</a><header class="topbar"><a class="brand" href="/" aria-label="Roadwise dashboard home"><span class="mark" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M8 34 17 10h5l-9 24M19 34l9-24h5l-9 24"/><path d="M23 31h13M27 26h9M31 21h5"/></svg></span><span>ROADWISE<small>INDIA · ROAD SAFETY DATA</small></span></a><nav aria-label="Main navigation">{% for label, href in nav %}<a href="{{ href }}" {% if active == label %}aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}</nav><div class="header-actions"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false"><span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Dark mode</span></button><a class="nav-cta" href="/latest">Explore data <span>↗</span></a></div></header>
<main id="main-content" tabindex="-1">{% block content %}{% endblock %}</main><footer><span>ROADWISE <span class="muted">· Data for safer journeys</span></span><span>Use reported figures with their source and coverage in mind.</span></footer><script>
(()=>{const button=document.querySelector('.theme-toggle');if(!button)return;const root=document.documentElement;const update=()=>{const dark=root.dataset.theme==='dark';button.setAttribute('aria-pressed',String(dark));button.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');button.title=dark?'Switch to light mode':'Switch to dark mode';button.querySelector('.theme-icon').textContent=dark?'☼':'☾';button.querySelector('.theme-label').textContent=dark?'Light mode':'Dark mode'};update();button.addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('roadwise-theme',root.dataset.theme)}catch(e){}update()})})();
</script></body></html>
